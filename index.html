<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[v1.1.2]アメダス観測一覧</title>

<style>
body{
  font-family:sans-serif;
  margin:0;
  padding:20px;
  background:#f5f5f5;
}

h1{
  margin-top:0;
}

#status{
  margin-bottom:12px;
}

.table-wrap{
  overflow:auto;
  background:#fff;
  border-radius:10px;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1400px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#222;
  color:#fff;
  position:sticky;
  top:0;
  z-index:1;
}

tr:nth-child(even){
  background:#fafafa;
}

.station{
  text-align:left;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>アメダス観測一覧</h1>
<div id="status">読み込み中...</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr id="thead-row">
        <th>地点</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
// =====================
// 表示項目
// =====================
const elements = {
  temp: { name:"気温", unit:"℃" },
  humidity: { name:"湿度", unit:"%" },
  pressure: { name:"現地気圧", unit:"hPa" },
  normalPressure: { name:"海面更正気圧", unit:"hPa" },
  wind: { name:"平均風速", unit:"m/s" },
  windDirection: { name:"風向", unit:null },
  precipitation10m: { name:"10分降水量", unit:"mm/10min" },
  precipitation1h: { name:"1時間降水量", unit:"mm/h" },
  precipitation3h: { name:"3時間降水量", unit:"mm/3h" },
  precipitation24h: { name:"24時間降水量", unit:"mm/24h" },
  snow: { name:"積雪深", unit:"cm" },
  snow1h: { name:"1時間降雪量", unit:"cm/h" },
  snow6h: { name:"6時間降雪量", unit:"cm/6h" },
  snow12h: { name:"12時間降雪量", unit:"cm/12h" },
  snow24h: { name:"24時間降雪量", unit:"cm/24h" },
  sun10m: { name:"10分日照", unit:"分" },
  sun1h: { name:"1時間日照", unit:"時間" },
  visibility: { name:"視程", unit:"m" },
  weather: { name:"現在天気", unit:null }
};

// =====================
// 風向
// =====================
const windDirectionMap = {
  0:"静穏",1:"NNE",2:"NE",3:"ENE",4:"E",5:"ESE",
  6:"SE",7:"SSE",8:"S",9:"SSW",10:"SW",11:"WSW",
  12:"W",13:"WNW",14:"NW",15:"NNW",16:"N"
};

// =====================
// 値取得
// =====================
function getValue(obj,key){

  if(!obj || !(key in obj)) return "--";

  const v = obj[key][0];

  if(v === null || v === undefined) return "--";

  if(key === "windDirection"){
    return windDirectionMap[v] ?? v;
  }

  return v;
}

// =====================
// 時刻生成
// =====================
function getTimeString(date){
  const yyyy = date.getFullYear();
  const MM = String(date.getMonth()+1).padStart(2,"0");
  const dd = String(date.getDate()).padStart(2,"0");
  const HH = String(date.getHours()).padStart(2,"0");
  const mm = String(date.getMinutes()).padStart(2,"0");
  return `${yyyy}${MM}${dd}${HH}${mm}00`;
}

// =====================
// 10分切り捨て
// =====================
function floor10(date){
  const d = new Date(date);
  d.setSeconds(0);
  d.setMilliseconds(0);
  d.setMinutes(Math.floor(d.getMinutes()/10)*10);
  return d;
}

// =====================
// stations取得
// =====================
async function fetchStations(){
  const res = await fetch("./points.json");
  if(!res.ok) throw new Error("points.json失敗");
  return await res.json();
}

// =====================
// アメダス取得
// =====================
async function fetchAmedas(){

  let date = floor10(new Date());

  for(let i=0;i<20;i++){

    const timeString = getTimeString(date);
    const url = `https://www.jma.go.jp/bosai/amedas/data/map/${timeString}.json`;

    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP");

      const data = await res.json();

      document.getElementById("status").textContent =
        `データ時刻: ${timeString}`;

      return data;

    }catch(e){
      console.log(timeString,"失敗");
    }

    date.setMinutes(date.getMinutes()-10);
  }

  throw new Error("全部失敗");
}

// =====================
// ヘッダー
// =====================
function buildHeader(){

  const tr = document.getElementById("thead-row");

  for(const k in elements){
    const th = document.createElement("th");
    const e = elements[k];
    th.textContent = e.unit ? `${e.name}(${e.unit})` : e.name;
    tr.appendChild(th);
  }
}

// =====================
// テーブル
// =====================
function buildTable(stations, amedas){

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  for(const code in stations){

    const st = stations[code];
    const d = amedas[code];

    const tr = document.createElement("tr");

    const td0 = document.createElement("td");
    td0.className = "station";
    td0.textContent = st.name;
    tr.appendChild(td0);

    for(const k in elements){
      const td = document.createElement("td");
      td.textContent = getValue(d,k);
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }
}

// =====================
// 実行
// =====================
(async () => {

  try{

    buildHeader();

    const stations = await fetchStations();
    const amedas = await fetchAmedas();

    buildTable(stations, amedas);

  }catch(e){

    console.error(e);
    document.getElementById("status").textContent =
      "読み込み失敗";
  }

})();
</script>

</body>
</html>
